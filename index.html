<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#081229">
<title>حكايا السِّراج</title>
<meta name="description" content="حكايا السِّراج: القصة يحكيها من شهدها. موقع تعليمي تفاعلي للأطفال.">
<link rel="preload" href="assets/fonts/tajawal-arabic-800-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/tajawal-arabic-500-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/film.css">
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<div class="moon" aria-hidden="true"></div>

<svg id="ground" viewBox="0 0 1200 220" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
  <defs>
    <g id="palm" fill="none" stroke-linecap="round">
      <path d="M0 0q7-42-3-84" stroke-width="7"/>
      <g stroke-width="4.5">
        <path d="M-3-84q-26-20-50-4"/><path d="M-3-84q-30-2-44 24"/><path d="M-3-84q-12-30-40-34"/>
        <path d="M-3-84q26-22 52-8"/><path d="M-3-84q32-4 46 22"/><path d="M-3-84q14-30 40-32"/>
      </g>
    </g>
  </defs>
  <path class="dune dune--far" d="M0 150q150-70 330-30t330-20 300 30 240-20v110H0z"/>
  <g class="palms palms--far" stroke="#0c1c3d">
    <use href="#palm" transform="translate(190 132) scale(.62)"/>
    <use href="#palm" transform="translate(236 140) scale(.48)"/>
    <use href="#palm" transform="translate(985 122) scale(.6)"/>
  </g>
  <path class="dune dune--mid" d="M0 180q200-60 420-18t380-16 400-6v80H0z"/>
  <g class="palms palms--near" stroke="#060f24">
    <use href="#palm" class="sway" transform="translate(88 176)"/>
    <use href="#palm" class="sway sway--b" transform="translate(1104 172) scale(-.86 .86)"/>
  </g>
  <path class="dune dune--near" d="M0 200q260-34 560-6t640-10v36H0z"/>
</svg>

<header class="topbar">
  <a class="brand" href="#/">
    <svg viewBox="0 0 24 34" aria-hidden="true"><path d="M12 1v5" stroke="#c9a24a" stroke-width="2" stroke-linecap="round"/><path d="M7 9q5-6 10 0z" fill="#c9a24a"/><path d="M7 10h10q5 8 0 16H7q-5-8 0-16z" fill="#ffd77a"/><path d="M7 27h10l-2 5H9z" fill="#c9a24a"/></svg>
    <span id="brandName"></span>
  </a>
  <div class="topbar__tools">
    <button class="chip" id="nameChip" type="button" hidden></button>
    <button class="iconbtn" id="soundBtn" type="button" aria-pressed="true">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path class="snd-on" d="M15 9q2.4 3 0 6M17.6 6.6q4.6 5.4 0 10.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path class="snd-off" d="M15.5 9.5l5 5m0-5l-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
  </div>
</header>

<main id="view" tabindex="-1"></main>

<div id="veil" aria-hidden="true"></div>
<canvas id="fx" aria-hidden="true"></canvas>

<noscript><p class="noscript">حكايا السِّراج يحتاج إلى تفعيل JavaScript في المتصفح.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
