<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1630">
<meta name="description" content="حكايا السِّراج: موقع تعليمي إسلامي تفاعلي للأطفال. القصة يحكيها من شهدها.">
<title>حكايا السِّراج</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/story.css">
<link rel="stylesheet" href="css/sections.css">
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>

<!-- تعريفات مشتركة لرسمة سِراج -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="sg-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b5a94"/><stop offset="1" stop-color="#16305a"/>
    </linearGradient>
    <linearGradient id="sg-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe6a3"/><stop offset=".5" stop-color="#e0b455"/><stop offset="1" stop-color="#a97f2c"/>
    </linearGradient>
    <radialGradient id="sg-halo">
      <stop offset="0" stop-color="var(--glow,#ffd77a)" stop-opacity=".75"/>
      <stop offset=".55" stop-color="var(--glow,#ffd77a)" stop-opacity=".18"/>
      <stop offset="1" stop-color="var(--glow,#ffd77a)" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>

<header id="hud">
  <button id="hud-back" class="hud-btn" aria-label="رجوع" hidden>
    <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <span class="hud-space"></span>
  <button id="hud-stars" class="hud-pill" aria-label="نجومي وأوسمتي">
    <svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17.2 5.9 20.6l1.4-6.8L2.2 9.1l6.9-.8z" fill="#ffd77a"/></svg>
    <b id="hud-count">0</b>
  </button>
  <button id="hud-sound" class="hud-btn" aria-label="الصوت">
    <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path class="snd-on" d="M16 8.5a5 5 0 010 7M18.5 6a8.5 8.5 0 010 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path class="snd-off" d="M16 9l5 6M21 9l-5 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </button>
</header>

<main id="view" class="view out"></main>
<div id="layer"></div>
<noscript><p style="color:#ffd77a;text-align:center;padding:40px">يحتاج الموقع إلى تفعيل JavaScript.</p></noscript>

<script src="js/core.js"></script>
<script src="js/home.js"></script>
<script src="js/stories.js"></script>
<script src="js/adhkar.js"></script>
<script src="js/games.js"></script>
<script src="js/house.js"></script>
<script src="js/parents.js"></script>
<script>HS.boot()</script>
</body>
</html>
