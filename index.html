<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>حكايا السِّراج — قريبًا</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;box-sizing:border-box}
  body{min-height:100vh;display:grid;place-items:center;text-align:center;overflow:hidden;
    font-family:Tajawal,sans-serif;color:#f6e7b8;
    background:radial-gradient(ellipse at 50% 30%,#16305a 0%,#0a1630 55%,#050b1c 100%)}
  .star{position:fixed;width:3px;height:3px;border-radius:50%;background:#fff;animation:tw 3s infinite ease-in-out}
  @keyframes tw{50%{opacity:.15}}
  .lantern{width:130px;animation:float 4s ease-in-out infinite;filter:drop-shadow(0 0 30px #f4c45a)}
  @keyframes float{50%{transform:translateY(-14px)}}
  .flame{animation:glow 1.6s ease-in-out infinite;transform-origin:50% 70%}
  @keyframes glow{50%{transform:scale(.85);opacity:.8}}
  h1{font-size:clamp(2.2rem,8vw,3.4rem);font-weight:800;margin-top:24px;color:#ffd77a}
  p{font-size:1.15rem;margin-top:10px;color:#8fe0d6}
</style>
</head>
<body>
<main>
  <svg class="lantern" viewBox="0 0 100 150" aria-label="سِراج">
    <path d="M50 4v14" stroke="#c9a24a" stroke-width="4" stroke-linecap="round"/>
    <path d="M32 26h36l-6-8H38z" fill="#c9a24a"/>
    <path d="M28 30h44l8 70H20z" fill="#1e3c6b" stroke="#c9a24a" stroke-width="3"/>
    <ellipse class="flame" cx="50" cy="70" rx="13" ry="20" fill="#ffd77a"/>
    <ellipse class="flame" cx="50" cy="74" rx="6" ry="10" fill="#fff4cf"/>
    <path d="M18 100h64l-6 12H24z" fill="#c9a24a"/>
    <path d="M40 112h20l-4 14H44z" fill="#c9a24a"/>
  </svg>
  <h1>حكايا السِّراج</h1>
  <p>القصة يحكيها من شهدها… قريبًا</p>
</main>
<script>
  for(let i=0;i<60;i++){const s=document.createElement('i');s.className='star';
    s.style.left=Math.random()*100+'vw';s.style.top=Math.random()*100+'vh';
    s.style.animationDelay=Math.random()*3+'s';document.body.appendChild(s);}
</script>
</body>
</html>
